<div class="header-branding">
    <h1>Cross-Realm Ledger</h1>
    <p>Aggregiertes Bestands- und Lagerhaltungssystem</p>
</div>
<div class="header-controls">
    <span id="status-msg">Bereit zum Einlesen.</span>
    <div class="action-stack">
        <input type="text" id="account-input" class="theme-selector" placeholder="Accountname wechseln" style="font-weight: 700; border-color: var(--blue-accent); color: var(--text-dark); width: 180px; text-transform: uppercase;">
        
        <button id="export-btn" class="theme-selector" style="font-weight: 700; border-color: var(--bg-border); background: var(--bg-card); color: var(--text-main); height: 32px; padding: 0 12px; display: inline-flex; align-items: center; gap: 6px;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display: inline-block; vertical-align: middle;">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            <span>EXPORT DATA</span>
        </button>
        
        <button id="settings-btn" class="theme-selector" style="border-color: var(--bg-border); background: var(--bg-card); color: var(--text-main); height: 32px; width: 32px; padding: 0; display: inline-flex; align-items: center; justify-content: center;" title="Optionen oeffnen">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
        </button>
        
        <button id="refresh-btn">Inventar synchronisieren</button>
    </div>
</div>
