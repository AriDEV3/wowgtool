<div class="setup-card">
    <h2>Account verknüpfen</h2>
    <p>Bitte gib deinen World of Warcraft Account-Ordnernamen ein (z.B. <code>12345678#1</code>), um dein Inventar zu laden.</p>
    
    <input type="text" id="setup-account-input" class="setup-input" placeholder="ACCOUNTNAME EINTRAGEN">
    
    <div class="setup-region-wrapper">
        <label class="setup-region-label">Spiel-Region festlegen:</label>
        <select id="setup-region-select" class="setup-region-select">
            <option value="eu">Europa (EU)</option>
            <option value="us">Amerika (US)</option>
        </select>
    </div>
    
    <button id="setup-submit-btn" class="setup-btn">Verbindung herstellen</button>
</div>
